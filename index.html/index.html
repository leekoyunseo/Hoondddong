<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 박정훈 보고싶어 !!!</title>
    <style>
        body { background-color: #ffb6c1; font-family: 'Courier New', monospace; overflow: hidden; text-align: center; user-select: none; padding-top: 20px; margin: 0; height: 100vh; }
        .header { background: #ff69b4; color: yellow; padding: 10px; font-size: 1.5em; font-weight: bold; border-bottom: 5px solid yellow; animation: blink 0.2s infinite; display: inline-block; width: 80%; margin-bottom: 20px; z-index: 10; position: relative;}
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .score-board { font-size: 1.2em; color: black; margin-bottom: 20px; display: flex; justify-content: space-around; background: #fff0f5; border: 3px solid #ff69b4; padding: 10px; width: 90%; margin: 0 auto 20px; z-index: 10; position: relative; border-radius: 10px; }
        #timer { color: red; font-weight: bold; }
        #target { position: absolute; width: 120px; height: 120px; object-fit: cover; cursor: crosshair; display: none; border: 4px solid #ff1493; box-shadow: 0 0 15px #ff1493; transition: all 0.3s ease-out; z-index: 50; touch-action: none; border-radius: 50%; background-color: white; }
        #game-over { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 100; padding: 20px; box-sizing: border-box; }
        #game-over h2 { font-size: 2.5em; color: #ff69b4; }
        button { background: #fff0f5; border: 2px solid #ff69b4; padding: 15px 30px; font-size: 1.1em; cursor: pointer; font-weight: bold; color: black; margin-top: 20px; border-radius: 10px; }
        .heart { position: absolute; color: rgba(255, 255, 255, 0.4); pointer-events: none; z-index: 1; }
    </style>
</head>
<body>

    <div class="header"> 💕 박정훈 때리기 💕 </div>
    <div class="score-board">
        <div>타격: <span id="score">0</span>회</div>
        <div>남은 시간: <span id="timer">5.0</span>초</div>
    </div>

    <img src="hoon.jpg" id="target" onclick="hitTarget()" ontouchstart="hitTarget()" onerror="findImage(this)">

    <div id="game-over">
        <h2> 끝 !!!! </h2>
        <p id="result-msg" style="color:white; font-size:1.2em;"></p>
        <p style="color: yellow; margin-bottom: 30px;">※ 똥 먹어. ※</p>
        <button onclick="startGame()">완전 버터떡이네 똥아</button>
    </div>

    <script>
        let score = 0; let timeLeft = 5.0; let gameInterval; let targetInterval;
        const target = document.getElementById('target');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const gameOverEl = document.getElementById('game-over');
        const resultMsgEl = document.getElementById('result-msg');

        // 사진 파일명을 계속 바꿔가며 찾아내는 함수
        let tryCount = 0;
        function findImage(img) {
            // 여기에 고윤서님의 모든 파일 가능성을 다 넣었습니다!
            const list = ['hoon.JPG', 'hoon.png', 'hoon.PNG', 'hoon', 'index/hoon.jpg', 'index/hoon.JPG', 'index/hoon'];
            if (tryCount < list.length) {
                img.src = list[tryCount];
                tryCount++;
            }
        }

        function startGame() {
            score = 0; timeLeft = 5.0;
            scoreEl.innerText = score; timerEl.innerText = timeLeft.toFixed(1);
            gameOverEl.style.display = 'none'; target.style.display = 'block';
            clearInterval(gameInterval); clearInterval(targetInterval);
            gameInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) endGame();
                else timerEl.innerText = timeLeft.toFixed(1);
            }, 100);
            moveTarget();
            targetInterval = setInterval(moveTarget, 1000); 
        }

        function hitTarget(e) { 
            if(e && e.cancelable) e.preventDefault();
            score++; scoreEl.innerText = score; moveTarget();
        }

        function moveTarget() {
            const x = Math.random() * (window.innerWidth - 130);
            const y = Math.random() * (window.innerHeight - 300) + 150;
            target.style.left = x + 'px'; target.style.top = y + 'px';
        }

        function endGame() {
            clearInterval(gameInterval); clearInterval(targetInterval);
            target.style.display = 'none'; gameOverEl.style.display = 'flex';
            let msg = score < 5 ? `실패! 똥아저씨 <br>(타격: ${score}회)` : score < 12 ? `좀 치네<br>(타격: ${score}회)` : `보고싶어 사랑해 뇸뇸<br>(타격: ${score}회)`;
            resultMsgEl.innerHTML = msg;
        }

        // 배경 하트
        for(let i=0; i<15; i++) {
            let heart = document.createElement('div');
            heart.className = 'heart'; heart.innerText = '❤';
            heart.style.left = Math.random() * 100 + 'vw'; heart.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(heart);
        }

        startGame();
    </script>
</body>
</html>
